name: Promote Tested Sync Branch

on:
  workflow_run:
    workflows: [Fork CI]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'sync/integration'
    uses: adampoit/patchlane/.github/workflows/promote.yml@6d7940f9870575c7c7d65a3d7561b7eef079132a
    with:
      base_branch: main
      sync_branch: sync/integration
      expected_sync_sha: ${{ github.event.workflow_run.head_sha }}
      implementation_repository: adampoit/patchlane
      implementation_ref: 6d7940f9870575c7c7d65a3d7561b7eef079132a
    secrets:
      token: ${{ secrets.FORK_SYNC_TOKEN }}
