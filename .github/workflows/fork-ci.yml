name: Fork CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sync/integration
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: package (ubuntu24.04)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/sync/integration'
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    env:
      CARGO_INCREMENTAL: "0"
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"

    steps:
      - name: set APT to non-interactive
        shell: bash
        run: "echo 'debconf debconf/frontend select Noninteractive' | debconf-set-selections"
      - name: Update APT
        shell: bash
        run: "apt update"
      - name: Install git
        shell: bash
        run: "apt-get install -y git"
      - name: Install curl
        shell: bash
        run: "apt-get install -y curl"
      - name: Update APT
        shell: bash
        run: "apt update"
      - name: Ensure /run/sshd exists
        shell: bash
        run: "mkdir -p /run/sshd"
      - name: Install openssh-server
        shell: bash
        run: "apt-get install -y openssh-server"
      - name: Workaround git permissions issue
        shell: bash
        run: "git config --global --add safe.directory /__w/wezterm/wezterm"
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Compile with sccache
        uses: mozilla-actions/sccache-action@v0.0.9
      - name: Cache Rust Dependencies
        uses: actions/cache@v4
        id: cache-cargo-vendor
        with:
          path: |
            vendor
            .cargo/config
          key: cargo-deps-${{ hashFiles('**/Cargo.lock') }}
      - name: Vendor dependecies
        if: steps.cache-cargo-vendor.outputs.cache-hit != 'true'
        shell: bash
        run: "cargo vendor --locked --versioned-dirs >> .cargo/config"
      - name: Install System Deps
        shell: bash
        run: "env CI=yes PATH=$PATH ./get-deps"
      - name: Build wezterm
        shell: bash
        run: "cargo build -p wezterm --release"
      - name: Build wezterm-gui
        shell: bash
        run: "cargo build -p wezterm-gui --release"
      - name: Build wezterm-mux-server
        shell: bash
        run: "cargo build -p wezterm-mux-server --release"
      - name: Build strip-ansi-escapes
        shell: bash
        run: "cargo build -p strip-ansi-escapes --release"
      - name: Install cargo-nextest from Cargo
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          cache-key: patchlane-sync-ubuntu24.04
      - name: Test
        shell: bash
        run: "cargo nextest run --all --no-fail-fast"
      - name: Package
        shell: bash
        run: "bash ci/deploy.sh"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-ubuntu24.04
          path: |
            wezterm-*.deb
            wezterm-*.xz
          retention-days: 5

  nix_build:
    name: nix-build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cache_path: linux
          - name: darwin
            os: macos-latest
            cache_path: darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Configure repository cache
        env:
          CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.cache_path }}
          CACHE_KEY: ${{ vars.NIX_CACHE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.config/nix
          printf '%s\n' "extra-substituters = $CACHE_URL" >> ~/.config/nix/nix.conf
          if [ -n "$CACHE_KEY" ]; then
            printf '%s\n' "extra-trusted-public-keys = $CACHE_KEY" >> ~/.config/nix/nix.conf
          fi

      - name: Evaluate flake outputs
        run: |
          set -euo pipefail
          sys=$(nix eval --impure --expr builtins.currentSystem --raw)
          nix --version
          nix flake metadata ./nix
          nix flake show ./nix --all-systems
          nix eval "./nix#packages.${sys}.default.drvPath" --raw

      - name: Build Nix package
        run: |
          set -euo pipefail
          sys=$(nix eval --impure --expr builtins.currentSystem --raw)
          nix build "./nix#packages.${sys}.default" --print-out-paths | tee /tmp/static-nix-cache-paths.txt

      - name: Save Nix binary
        if: github.repository == 'adampoit/wezterm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: adampoit/static-nix-cache/save@986776d29acbd428597c314fa0a02abebd403cea
        with:
          paths-file: /tmp/static-nix-cache-paths.txt
          name: ${{ matrix.name }}
          signing-key: ${{ secrets.NIX_CACHE_SIGNING_KEY }}

  publish_nix_cache:
    name: publish nix cache
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.repository == 'adampoit/wezterm' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [nix_build]
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Setup Nix
        uses: nixbuild/nix-quick-install-action@v34

      - name: Generate Linux cache site
        uses: adampoit/static-nix-cache/deploy@986776d29acbd428597c314fa0a02abebd403cea
        with:
          artifact-pattern: static-nix-cache-linux
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-release-tag: nix-cache-linux
          static: ./site/linux

      - name: Generate Darwin cache site
        uses: adampoit/static-nix-cache/deploy@986776d29acbd428597c314fa0a02abebd403cea
        with:
          artifact-pattern: static-nix-cache-darwin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-release-tag: nix-cache-darwin
          static: ./site/darwin

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy GitHub Pages site
        id: pages
        uses: actions/deploy-pages@v4
