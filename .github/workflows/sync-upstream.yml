name: Sync Upstream Integration

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Skip push operations.
        type: boolean
        required: false
        default: true
      upstream_ref:
        description: Upstream branch ref to rebuild from when release_selector is blank.
        type: string
        required: false
        default: main
      release_selector:
        description: Use `latest`, `prerelease`, or a regex for upstream tags. Leave blank to use upstream_ref.
        type: string
        required: false
        default: ""
      patch_refs:
        description: Comma-separated patch branches applied in order.
        type: string
        required: false
        default: patch/fork-ci, patch/vim-copy-mode, patch/font-thickening

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN || github.token }}
      UPSTREAM_OWNER: wezterm
      UPSTREAM_REPO: wezterm
      BASE_BRANCH: main
      UPSTREAM_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.upstream_ref || 'main' }}
      RELEASE_SELECTOR: ${{ github.event_name == 'workflow_dispatch' && inputs.release_selector || '' }}
      SYNC_BRANCH: sync/integration
      PATCH_REFS: ${{ github.event_name == 'workflow_dispatch' && inputs.patch_refs || 'patch/fork-ci, patch/vim-copy-mode, patch/font-thickening' }}
      DRY_RUN: ${{ inputs.dry_run || false }}
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run patchlane sync
        run: npx patchlane@latest sync
